version: "3.9"

services:
  rde-backend:
    build: .
    container_name: rde-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persiste o banco SQLite local fora do container
      - ./rde_local.db:/app/rde_local.db
    networks:
      - rde-net

networks:
  rde-net:
    driver: bridge
