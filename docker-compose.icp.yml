version: "3.9"

services:
  rde-platform:
    image: ghcr.io/josemaramorim/rde-platform:latest
    container_name: rde-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - icontainer.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/rde_local.db
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:--1001804981654}
      - TELEGRAM_GROUP_NAME=${TELEGRAM_GROUP_NAME:-R&DE🇧🇷}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-7533153324:AAFnjAwlQcLQfJeSFNOPeg0iVI7F97LDzzI}
    volumes:
      - rde_db:/data

volumes:
  rde_db:
