version: "3.9"

services:
  rde-platform:
    image: ghcr.io/josemaramorim/rde-platform:latest
    container_name: rde-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - icontainer.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/rde_local.db
    volumes:
      - rde_db:/data

volumes:
  rde_db:
